name: CI/CD pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - 'feat/**'

permissions:
  pull-requests: write
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Installing terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.2"

      - name: Get changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            terraform:
              - '**/*.tf'
            k8s:
              - 'k8s/*.yml'
      
      - name: Write service account key
        if: steps.changes.output.terraform == 'true'
        run: echo '${{ secrets.YC_SA_JSON_CREDENTIALS }}' > key.json
      
      - name: Write meta file
        if: steps.changes.output.terraform == 'true'
        env: 
          META_CONTENT: ${{ secrets.TF_META }}
        run: |
          cat <<EOF> meta.txt
          $META_CONTENT
          EOF

      - name: Terraform init
        env: 
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        if: steps.changes.output.terraform == 'true'
        run: terraform init
      
      - name: Terraform plan
        if: steps.changes.output.terraform == 'true'
        id: plan
        run: |
          terraform plan \
          -no-color \
          -var="sa_key_file=key.json" \
          -var="cloud_id=${{ secrets.YC_CLOUD_ID }}" \
          -var="folder_id=${{ secrets.YC_FOLDER_ID }}" \
          -var="meta_file=meta.txt"
        continue-on-error: true
      
      - name: Check status plan
        if: steps.plan.outcome == 'failure'
        run: exit 1

      - name: Comment PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const output = `#### Terraform Plan
            \`\`\`
            ${{ steps.plan.outputs.stdout }}
            \`\`\`
            `;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

      - name: Terraform apply
        if: github.event_name == 'push'
        run: terraform apply --auto-approve
      
      
